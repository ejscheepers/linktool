services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      DATABASE_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Johannesburg}
    volumes:
      - linktool_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/resources/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  linktool_data:
